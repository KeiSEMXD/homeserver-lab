# /etc/ssh/sshd_config.d/00-hardening.conf
# "00-" so it is read first: in sshd the first value obtained wins,
# which overrides e.g. PasswordAuthentication yes in 50-cloud-init.conf.
#
# Validate: sudo sshd -t
# Apply:    sudo systemctl restart ssh
# Test from a NEW terminal before closing the current session.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
