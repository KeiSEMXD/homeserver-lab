# Jellyfin media server
# Location on the server: ~/jellyfin/compose.yaml
# Start: sudo docker compose up -d
services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: "1000:1000"              # run as a normal user, not root
    ports:
      - "8096:8096"                # TODO: bind to specific addresses instead of all interfaces
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /mnt/media:/media:ro       # media library is read-only inside the container
    restart: unless-stopped
