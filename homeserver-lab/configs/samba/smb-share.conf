# Appended to /etc/samba/smb.conf
# Validate: testparm -s
# Apply:    sudo systemctl restart smbd

[media]
   path = /mnt/media
   valid users = @media        # members of the "media" group only
   read only = no
   browseable = yes
   create mask = 0664          # new files: rw-rw-r--
   directory mask = 2775       # new folders: rwxrwsr-x (setgid keeps the media group)
